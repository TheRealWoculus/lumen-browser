name: Build
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --mac --x64
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-macos
          path: releases/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --linux --x64
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: releases/*.{AppImage,tar.gz}

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: releases/*.exe
