<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: #f2f2ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      background-color: #07070e;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      overflow-y: auto;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, #7c3aed22, transparent 60%),
        linear-gradient(180deg, transparent 40%, #07070ecc 100%);
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 640px; text-align: center; }
    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      border-radius: 16px;
      box-shadow: 0 12px 48px #7c3aed44;
    }
    h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px;
      background: linear-gradient(135deg, var(--accent, #7c3aed), var(--accent2, #06b6d4));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { color: #8888a8; font-size: 13px; margin-bottom: 24px; }
    .search-box {
      display: flex;
      background: #10101cdd;
      border: 1.5px solid #1e1e30;
      border-radius: 14px;
      padding: 4px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within {
      border-color: var(--accent, #7c3aed);
      box-shadow: 0 0 0 4px #7c3aed33;
    }
    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 14px 16px;
      font-size: 15px;
      color: #f2f2ff;
      outline: none;
      font-family: inherit;
    }
    .search-box button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent, #7c3aed), var(--accent2, #06b6d4));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .bookmarks-section { margin-top: 32px; width: 100%; }
    .bookmarks-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: #8888a8; margin-bottom: 12px;
    }
    .bookmarks-header span { text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    #bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }
    .bm-card {
      padding: 14px 8px 10px;
      background: #10101c99;
      border: 1px solid #1e1e30;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      text-decoration: none;
      color: #cacade;
      font-size: 12px;
      text-align: center;
      overflow: hidden;
    }
    .bm-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent, #7c3aed);
    }
    .bm-card .bm-fav {
      width: 28px; height: 28px; border-radius: 6px; margin: 0 auto 6px; display: block;
    }
    .bm-card .bm-title {
      display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bm-card .bm-url {
      display: block; font-size: 10px; color: #666688; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
    }
    .empty-bookmarks {
      color: #666688; font-size: 13px; padding: 24px 0;
    }
    .clock {
      position: absolute; top: 24px; right: 28px;
      font-size: 13px; color: #8888a8; z-index: 2;
    }
    @media (max-width: 480px) {
      #bookmarks-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="clock" id="clock"></div>
  <div class="wrap">
    <img class="logo" id="logo" src="../assets/lumen_128.png" alt="Lumen" onerror="this.style.display='none'">
    <h1>Good <span id="greet">day</span></h1>
    <p class="sub">Search the web or enter a URL</p>
    <form class="search-box" id="search-form">
      <input type="text" id="q" placeholder="Search with Lumen Lens…" autofocus autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div class="bookmarks-section">
      <div class="bookmarks-header">
        <span>Bookmarks</span>
        <a href="lumen://settings:bookmarks" id="manage-bm-link" style="color:var(--accent,#7c3aed);text-decoration:none;cursor:pointer">Manage</a>
      </div>
      <div id="bookmarks-grid"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const accent = params.get('accent') || '#7C3AED';
    const accent2 = params.get('accent2') || '#06B6D4';
    const wp = params.get('wallpaper');
    const wpMode = params.get('wpMode') || 'cover';
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent2', accent2);
    if (wp) {
      document.body.style.backgroundImage = `url("${decodeURIComponent(wp)}")`;
      document.body.style.backgroundSize = wpMode;
    }
    const h = new Date().getHours();
    document.getElementById('greet').textContent =
      h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';

    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 500);

    function navigate(url) {
      window.parent.postMessage({ type: 'lumen-navigate', query: url }, '*');
    }

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('q').value.trim();
      if (q) navigate(q);
    });

    document.getElementById('manage-bm-link').addEventListener('click', (e) => {
      e.preventDefault();
      navigate('lumen://settings:bookmarks');
    });

    async function loadBookmarks() {
      const grid = document.getElementById('bookmarks-grid');
      const section = document.querySelector('.bookmarks-section');
      try {
        let bookmarks = [];
        if (window.lumenGuest && window.lumenGuest.getBookmarks) {
          bookmarks = await window.lumenGuest.getBookmarks();
        }
        if (bookmarks.length === 0) {
          grid.innerHTML = '<div class="empty-bookmarks">No bookmarks yet. Press Ctrl+D to bookmark this page.</div>';
          section.style.display = 'none';
          return;
        }
        section.style.display = '';
        grid.innerHTML = bookmarks.map((bm) => {
          let host = '';
          try { host = new URL(bm.url).hostname; } catch {}
          return `<a class="bm-card" href="${bm.url}">
            <img class="bm-fav" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=32" alt="" onerror="this.style.display='none'">
            <span class="bm-title">${escapeHtml(bm.title || bm.url)}</span>
            <span class="bm-url">${escapeHtml(host)}</span>
          </a>`;
        }).join('');
        grid.querySelectorAll('.bm-card').forEach((el) => {
          el.addEventListener('click', (e) => {
            e.preventDefault();
            navigate(el.getAttribute('href'));
          });
        });
      } catch {
        grid.innerHTML = '<div class="empty-bookmarks">Could not load bookmarks.</div>';
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    loadBookmarks();

    // Reload bookmarks every 10 seconds
    setInterval(loadBookmarks, 10000);
  </script>
</body>
</html>
